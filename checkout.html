<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finalizar compra | ToonTura</title>
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://sdk.mercadopago.com/js/v2"></script>
<style>
  #fs-dados{border:0;margin:24px 0 0;padding:0;min-width:0;display:grid;gap:12px;max-width:480px;}
  #fs-dados h3{margin:14px 0 0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);}
  #fs-dados input[type=text]{width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:400 14px 'Archivo',sans-serif;}
  .linha{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .resumo{max-width:480px;border:1px solid var(--line);padding:14px 16px;font-size:14px;}
  .resumo div{display:flex;justify-content:space-between;padding:3px 0;}
  .resumo .tot{font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:8px;}
  .opcoes-entrega{display:grid;gap:8px;}
  .opcao-box{display:block;padding:12px;border:1px solid var(--line);cursor:pointer;font-size:14px;}
  .opcao-box small{display:block;color:var(--ink-dim);margin-top:2px;}
  .opcao-box input{margin-right:8px;}
  #painel-envio,#painel-retirada{display:grid;gap:12px;}
  #fretes,#pontos{font-size:14px;}
  #continuar{margin-top:12px;}
  #painel-pagamento{max-width:520px;margin-top:24px;}
  #painel-pagamento h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);}
  #alterar{background:none;border:none;color:var(--ink-dim);font:600 13px 'Archivo',sans-serif;text-decoration:underline;cursor:pointer;margin-top:14px;padding:0;}
  #erro-init,#resultado{max-width:520px;margin-top:14px;font-size:14px;}
  #erro-init{color:#c0392b;}
  #resultado img{width:220px;height:220px;display:block;margin:12px 0;background:#fff;padding:8px;}
  #resultado textarea{width:100%;max-width:480px;min-height:80px;padding:8px;font:12px monospace;}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html"><img src="img/logo.png" alt="ToonTura"></a>
    <nav class="navlinks">
      <a href="index.html">Loja</a>
      <a class="cart-link" href="carrinho.html">Carrinho <span id="contador">0</span></a>
    </nav>
  </div>
</header>

<main class="wrap page">
  <h1>Finalizar compra</h1>

  <div class="resumo" id="resumo"></div>
  <div id="erro-init" role="alert" hidden></div>

  <fieldset id="fs-dados">
    <h3>Seus dados</h3>
    <input type="text" id="c-nome" placeholder="Nome completo" autocomplete="name">
    <input type="text" id="c-whats" placeholder="WhatsApp com DDD, ex: 35 99999-9999" inputmode="numeric">

    <h3>Como você quer receber?</h3>
    <div class="opcoes-entrega">
      <label class="opcao-box">
        <input type="radio" name="modo" value="envio" checked> Receber em casa
        <small>Frete calculado pelo seu CEP</small>
      </label>
      <label class="opcao-box">
        <input type="radio" name="modo" value="retirada"> Retirar em mãos
        <small>Grátis, em um dos pontos de retirada</small>
      </label>
    </div>

    <div id="painel-envio">
      <input type="text" id="c-cep" placeholder="CEP" maxlength="9" inputmode="numeric">
      <input type="text" id="c-rua" placeholder="Rua">
      <div class="linha">
        <input type="text" id="c-numero" placeholder="Número">
        <input type="text" id="c-comp" placeholder="Complemento">
      </div>
      <input type="text" id="c-bairro" placeholder="Bairro">
      <div class="linha">
        <input type="text" id="c-cidade" placeholder="Cidade">
        <input type="text" id="c-uf" placeholder="UF" maxlength="2">
      </div>
      <div id="fretes">Informe o CEP para ver as opções de frete.</div>
    </div>

    <div id="painel-retirada" hidden>
      <div id="pontos"></div>
    </div>
  </fieldset>

  <button type="button" class="btn" id="continuar">Continuar para o pagamento</button>

  <section id="painel-pagamento" hidden>
    <h3>Pagamento</h3>
    <div id="brick-status">Carregando formas de pagamento...</div>
    <div id="paymentBrick_container"></div>
    <button type="button" id="alterar">Alterar dados ou entrega</button>
  </section>

  <div id="resultado" role="status" aria-live="polite"></div>
</main>

<footer>
  <div class="wrap foot-row">
    <img src="img/logo.png" alt="ToonTura">
    <div class="foot-meta">© 2026 ToonTura</div>
  </div>
</footer>

<script src="produtos.js"></script>
<script>
const $ = id => document.getElementById(id);
const brlFmt = v => "R$ " + Number(v).toFixed(2).replace(".", ",");
const carrinho = JSON.parse(localStorage.getItem("carrinho") || "[]");

let subtotal = 0;
let modo = "envio";       // "envio" ou "retirada"
let freteSel = null;      // opção de frete escolhida
let pontoSel = null;      // id do ponto de retirada
let bricksBuilder = null;
let brickController = null;

function mostrarErroInit(msg) {
  const el = $("erro-init");
  el.hidden = false;
  el.textContent = msg;
}

function valorEntrega() {
  if (modo === "retirada") return 0;
  return freteSel ? freteSel.preco : null;   // null = ainda não escolhido
}

function atualizarResumo() {
  const ent = valorEntrega();
  const textoEnt = modo === "retirada"
    ? "Retirada (grátis)"
    : (ent === null ? "escolha o frete" : brlFmt(ent));
  $("resumo").innerHTML = `
    <div><span>Produtos</span><span>${brlFmt(subtotal)}</span></div>
    <div><span>Entrega</span><span>${textoEnt}</span></div>
    <div class="tot"><span>Total</span><span>${brlFmt(subtotal + (ent || 0))}</span></div>`;
}

async function calcularFrete() {
  const cep = $("c-cep").value.replace(/\D/g, "");
  const box = $("fretes");
  freteSel = null;
  atualizarResumo();
  if (cep.length !== 8) return;

  box.textContent = "Calculando frete...";
  try {
    const itens = carrinho.map(i => ({ id: i.id, qtd: Number(i.qtd || i.quantidade || 1) }));
    const r = await fetch("/api/frete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cep, itens })
    });
    const d = await r.json();
    if (!r.ok || !d.opcoes || !d.opcoes.length) {
      box.textContent = d.erro || "Nenhuma opção de frete para este CEP.";
      return;
    }
    box.innerHTML = d.opcoes.map((o, i) => `
      <label class="opcao-box">
        <input type="radio" name="frete" value="${i}"> ${o.nome}: ${brlFmt(o.preco)}
        <small>${o.prazo} dias úteis</small>
      </label>`).join("");
    box.querySelectorAll("input").forEach(el => {
      el.onchange = () => { freteSel = d.opcoes[Number(el.value)]; atualizarResumo(); };
    });
  } catch (e) {
    box.textContent = "Erro ao calcular o frete.";
  }
}

function trocarModo(novo) {
  modo = novo;
  $("painel-envio").hidden = modo !== "envio";
  $("painel-retirada").hidden = modo !== "retirada";
  atualizarResumo();
}

function desmontarBrick() {
  if (brickController) {
    try { brickController.unmount(); } catch (e) {}
    brickController = null;
  }
}

async function montarBrick(amount) {
  desmontarBrick();
  $("brick-status").textContent = "Carregando formas de pagamento...";
  const settings = {
    initialization: { amount },
    customization: {
      paymentMethods: {
        creditCard: "all",
        debitCard: "all",
        ticket: "all",
        bankTransfer: "all",
        maxInstallments: 1
      }
    },
    callbacks: {
      onReady: () => { $("brick-status").textContent = ""; },
      onSubmit: ({ selectedPaymentMethod, formData }) => enviarPagamento(formData),
      onError: err => {
        console.error("Erro no Brick:", err);
        mostrarErroInit("Erro no formulário de pagamento. Recarregue a página e tente de novo.");
      }
    }
  };
  brickController = await bricksBuilder.create("payment", "paymentBrick_container", settings);
}

function dadosDoPedido() {
  const v = id => $(id).value.trim();
  return {
    itens: carrinho.map(i => ({
      id: i.id,
      qtd: Number(i.qtd || i.quantidade || 1),
      tamanho: i.tamanho || "Único",
      estampa: i.estampa || null,
      cor: i.cor || null
    })),
    cliente: {
      nome: v("c-nome"), whatsapp: v("c-whats"),
      cep: v("c-cep"), rua: v("c-rua"), numero: v("c-numero"), complemento: v("c-comp"),
      bairro: v("c-bairro"), cidade: v("c-cidade"), uf: v("c-uf").toUpperCase()
    },
    entrega: modo === "retirada"
      ? { tipo: "retirada", pontoId: pontoSel }
      : { tipo: "envio", freteId: freteSel && freteSel.id }
  };
}

// O Brick espera uma Promise: se rejeitar, ele mostra erro e deixa o cliente tentar de novo
async function enviarPagamento(formData) {
  const out = $("resultado");
  out.textContent = "Processando pagamento, aguarde...";

  const r = await fetch("/api/process-payment", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ formData, ...dadosDoPedido() })
  });
  const d = await r.json();

  if (!r.ok) {
    out.textContent = "Erro: " + (d.erro || "não foi possível processar o pagamento.");
    throw new Error(d.erro || "Erro ao processar pagamento");
  }
  if (d.status === "rejected") {
    out.textContent = "Pagamento recusado. Confira os dados ou tente outro meio de pagamento.";
    throw new Error("rejected");
  }

  out.textContent = "";
  setTimeout(() => mostrarResultado(d), 0);   // depois que o Brick receber a resposta
}

function copiarPix() {
  const t = $("pix-code");
  t.select();
  navigator.clipboard.writeText(t.value).catch(() => document.execCommand("copy"));
  $("pix-copiado").textContent = "Código copiado!";
}

function mostrarResultado(d) {
  localStorage.removeItem("carrinho");
  desmontarBrick();
  $("fs-dados").hidden = true;
  $("continuar").hidden = true;
  $("painel-pagamento").hidden = true;

  const out = $("resultado");
  let html;

  if (d.status === "approved") {
    html = `<strong>Pagamento aprovado!</strong><br>Número do pedido: ${d.id}<br>Guarde este número.`;
  } else if (d.pix) {
    html = `<strong>Quase lá! Pague com Pix.</strong><br>Pedido ${d.id}. Escaneie o QR Code ou copie o código abaixo:` +
      (d.pix.qr_code_base64 ? `<img src="data:image/png;base64,${d.pix.qr_code_base64}" alt="QR Code Pix">` : "") +
      `<textarea id="pix-code" readonly></textarea><br>` +
      `<button type="button" class="btn" onclick="copiarPix()">Copiar código Pix</button> <span id="pix-copiado"></span>` +
      `<br><br>O pedido é confirmado assim que o pagamento for identificado.`;
  } else if (d.boleto_url) {
    html = `<strong>Boleto gerado.</strong><br>Pedido ${d.id}.<br>` +
      `<a class="btn" style="display:inline-block;margin-top:12px;text-decoration:none" href="${d.boleto_url}" target="_blank" rel="noopener">Abrir boleto</a>` +
      `<br><br>O pedido é confirmado depois da compensação do pagamento.`;
  } else {
    html = `<strong>Pagamento em análise.</strong><br>Pedido ${d.id}. Avisaremos quando for confirmado.`;
  }

  if (modo === "retirada") html += "<br>Entraremos em contato pelo WhatsApp para combinar a retirada.";
  out.innerHTML = html;
  if (d.pix && $("pix-code")) $("pix-code").value = d.pix.qr_code;
}

function continuarParaPagamento() {
  const out = $("resultado");
  out.textContent = "";
  const v = id => $(id).value.trim();

  if (!v("c-nome") || v("c-whats").replace(/\D/g, "").length < 10) {
    out.textContent = "Preencha seu nome e o WhatsApp com DDD.";
    return;
  }
  if (modo === "envio") {
    if (v("c-cep").replace(/\D/g, "").length !== 8 || !v("c-rua") || !v("c-numero") || v("c-uf").length !== 2) {
      out.textContent = "Preencha o endereço de entrega completo.";
      return;
    }
    if (!freteSel) { out.textContent = "Escolha uma opção de frete."; return; }
  } else if (!pontoSel) {
    out.textContent = "Escolha um ponto de retirada.";
    return;
  }

  const amount = Math.round((subtotal + valorEntrega()) * 100) / 100;
  $("fs-dados").disabled = true;
  $("continuar").hidden = true;
  $("painel-pagamento").hidden = false;
  montarBrick(amount).catch(e => {
    console.error(e);
    mostrarErroInit("Não foi possível carregar o pagamento. Recarregue a página.");
  });
}

function voltarParaDados() {
  desmontarBrick();
  $("painel-pagamento").hidden = true;
  $("fs-dados").disabled = false;
  $("continuar").hidden = false;
  $("resultado").textContent = "";
}

async function iniciar() {
  const contador = $("contador");
  if (contador) contador.innerText = carrinho.reduce((a, i) => a + Number(i.qtd || i.quantidade || 1), 0);

  if (!carrinho.length) {
    $("resumo").innerHTML = "Seu carrinho está vazio. <a href='index.html'>Voltar à loja</a>";
    $("fs-dados").hidden = true;
    $("continuar").hidden = true;
    return;
  }

  // Chave pública e pontos de retirada vêm do servidor
  let cfg;
  try {
    const r = await fetch("/api/mp-config", { cache: "no-store" });
    cfg = await r.json();
    if (!r.ok || !cfg.publicKey) throw new Error(cfg.error || "Chave pública ausente");
  } catch (e) {
    mostrarErroInit("Não foi possível carregar o pagamento: " + e.message);
    $("continuar").disabled = true;
    return;
  }

  // Subtotal (só exibição: o servidor recalcula tudo)
  carrinho.forEach(i => {
    const ref = PRODUTOS.find(p => p.id === i.id);
    subtotal += Number(i.preco || (ref && ref.preco) || 0) * Number(i.qtd || i.quantidade || 1);
  });
  atualizarResumo();

  // Pontos de retirada
  $("pontos").innerHTML = (cfg.pontos || []).map(p => `
    <label class="opcao-box">
      <input type="radio" name="ponto" value="${p.id}"> ${p.nome}
      <small>${p.detalhe || ""}</small>
    </label>`).join("");
  document.querySelectorAll("input[name=ponto]").forEach(el => {
    el.onchange = () => { pontoSel = el.value; };
  });

  document.querySelectorAll("input[name=modo]").forEach(el => {
    el.onchange = () => trocarModo(el.value);
  });

  // CEP preenche o endereço e calcula o frete
  $("c-cep").addEventListener("blur", async () => {
    const cep = $("c-cep").value.replace(/\D/g, "");
    if (cep.length !== 8) return;
    try {
      const d = await (await fetch(`https://viacep.com.br/ws/${cep}/json/`)).json();
      if (!d.erro) {
        $("c-rua").value = d.logradouro; $("c-bairro").value = d.bairro;
        $("c-cidade").value = d.localidade; $("c-uf").value = d.uf;
      }
    } catch (e) {}
    calcularFrete();
  });

  if (typeof MercadoPago === "undefined") {
    mostrarErroInit("O SDK do Mercado Pago não carregou. Se você usa bloqueador de anúncios, desative-o nesta página.");
    $("continuar").disabled = true;
    return;
  }

  const mp = new MercadoPago(cfg.publicKey, { locale: "pt-BR" });
  bricksBuilder = mp.bricks();

  $("continuar").onclick = continuarParaPagamento;
  $("alterar").onclick = voltarParaDados;
}

iniciar();
</script>
</body>
</html>
