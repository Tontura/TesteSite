<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToonTura</title><link rel="stylesheet" href="style.css">
</head><body>
<header>
  <a href="index.html"><img src="img/logo.png" alt="ToonTura"></a>
  <nav><a href="index.html">Loja</a><a href="carrinho.html">Carrinho (<span id="contador">0</span>)</a></nav>
</header>
<main>
  <h1 id="titulo"></h1><p id="texto" style="margin:12px 0 20px"></p>
  <a class="btn" style="display:block;text-align:center;text-decoration:none" href="index.html">Voltar à loja</a>
</main>
<footer><img src="img/logo.png" alt="ToonTura"></footer>
<script src="loja.js"></script>
<script>
const s = new URLSearchParams(location.search).get("status");
const m = {
  sucesso: ["Pagamento aprovado!", "Obrigado pela compra. Você receberá os detalhes por e-mail."],
  pendente: ["Pagamento pendente", "Assim que for confirmado, avisaremos você."],
  erro: ["Pagamento não concluído", "Nada foi cobrado. Você pode tentar de novo pelo carrinho."]
};
const [t, x] = m[s] || m.erro;
document.getElementById("titulo").textContent = t;
document.getElementById("texto").textContent = x;
if (s === "sucesso") localStorage.removeItem("carrinho");
</script></body></html>
