<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToonTura</title><link rel="stylesheet" href="style.css">
</head><body>
<header>
  <a href="index.html"><img src="img/logo.png" alt="ToonTura"></a>
  <nav><a href="index.html">Loja</a><a href="carrinho.html">Carrinho (<span id="contador">0</span>)</a></nav>
</header>
<main>
  <div class="filtros">
    <button class="ativo" data-cat="todos">Todos</button>
    <button data-cat="camisetas">Camisetas</button>
    <button data-cat="acessorios">Acessórios</button>
  </div>
  <div class="grade" id="grade"></div>
</main>
<footer><img src="img/logo.png" alt="ToonTura"></footer>>
<script src="produtos.js"></script><script src="loja.js"></script>
<script>
const grade = document.getElementById("grade");
function render(cat){
  const l = cat === "todos" ? PRODUTOS : PRODUTOS.filter(p => p.categoria === cat);
  grade.innerHTML = l.map(p => `<a class="card" href="produto.html?id=${p.id}">
    <img src="${p.imagem}" alt="${p.nome}"><h3>${p.nome}</h3><p class="preco">${brl(p.preco)}</p></a>`).join("");
}
document.querySelectorAll(".filtros button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".filtros button").forEach(x => x.classList.remove("ativo"));
  b.classList.add("ativo"); render(b.dataset.cat);
});
render("todos");
</script></body></html>
