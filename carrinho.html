<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrinho | ToonTura</title>

<!-- Ícone da aba (Favicon) -->
  <link rel="icon" type="image/png" href="img/icon.png">
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">








</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html"><img src="img/logo.png" alt="ToonTura"></a>
    <nav class="navlinks">
      <a href="index.html">Loja</a>
      <a class="cart-link" href="carrinho.html">Carrinho <span id="contador">0</span></a>
    </nav>
  </div>
</header>

<main class="wrap page">
  <h1>Carrinho</h1>
  <div id="itens"></div>
























  <div class="total"><span>Total</span><span id="total">R$ 0,00</span></div>
  <button class="btn" id="pagar">Pagar com Mercado Pago</button>
  <p id="msg"></p>
</main>

<footer>
  <div class="wrap foot-row">
    <img src="img/logo.png" alt="ToonTura">
    <div class="foot-meta">© 2026 ToonTura</div>
  </div>
</footer>

<script src="produtos.js"></script>
<script src="loja.js"></script>
<script>



function obterCarrinho() {
  if (typeof getCarrinho === 'function') return getCarrinho();
  return JSON.parse(localStorage.getItem("carrinho") || "[]");
}

function guardarCarrinho(carrinho) {
  if (typeof setCarrinho === 'function') {
    setCarrinho(carrinho);
  } else {
    localStorage.setItem("carrinho", JSON.stringify(carrinho));
  }
}

function obterTotalItens(carrinho) {
  return carrinho.reduce((acc, item) => acc + Number(item.qtd || item.quantidade || 1), 0);
}

function atualizarContadorHeader() {
  const carrinho = obterCarrinho();
  const contador = document.getElementById("contador");
  if (contador) {
    contador.innerText = obterTotalItens(carrinho);
  }
}

function formatarPreco(valor) {
  if (typeof brl === 'function') return brl(valor);
  return "R$ " + Number(valor).toFixed(2).replace(".", ",");
}





function render() {
  const carrinho = obterCarrinho();
  let total = 0;

  const containerItens = document.getElementById("itens");

  if (!carrinho.length) {
    containerItens.innerHTML = "<p>Seu carrinho está vazio.</p>";
    document.getElementById("total").textContent = formatarPreco(0);
    document.getElementById("pagar").disabled = true;

    atualizarContadorHeader();
    return;
  }

  containerItens.innerHTML = carrinho.map((item, index) => {
    const prodRef = typeof PRODUTOS !== 'undefined' ? PRODUTOS.find(p => p.id === item.id) : null;
    
    const preco = item.preco || (prodRef ? prodRef.preco : 0);
    const qtd = Number(item.qtd || item.quantidade || 1);
    const nome = item.nome || (prodRef ? prodRef.nome : 'Produto');
    const imagem = item.imagem || (prodRef ? (prodRef.imagem || (prodRef.imagens && prodRef.imagens[0])) : '');

    total += preco * qtd;

    const detalhes = [
      `Tam. ${item.tamanho || 'Único'}`,
      item.estampa ? `Estampa: ${item.estampa}` : null,
      item.cor ? `Cor: ${item.cor}` : null,
      `${qtd}x`,
      formatarPreco(preco)
    ].filter(Boolean).join(" · ");

    return `
      <div class="item">
        <img src="${imagem}" alt="${nome}">
        <div>
          <strong>${nome}</strong><br>
          ${detalhes}
        </div>
        <button onclick="remover(${index})">Remover</button>
      </div>
    `;
  }).join("");

  document.getElementById("total").textContent = formatarPreco(total);
  document.getElementById("pagar").disabled = false;

  atualizarContadorHeader();
}

function remover(index) {
  const carrinho = obterCarrinho();
  carrinho.splice(index, 1);
  guardarCarrinho(carrinho);
  render();

}
















































document.getElementById("pagar").onclick = async () => {
  const btn = document.getElementById("pagar");
  const msg = document.getElementById("msg");


















  btn.disabled = true;
  btn.textContent = "Aguarde...";
  msg.textContent = "";

  try {
    const carrinhoBruto = obterCarrinho();
    
    // Formata os itens com todos os campos exigidos pela API do Mercado Pago
    const itensFormatados = carrinhoBruto.map(item => ({
      id: item.id,
      qtd: Number(item.qtd || item.quantidade || 1),
      tamanho: item.tamanho || 'Único',
      estampa: item.estampa || 'Frente',
      cor: item.cor || 'Preta'
    }));

    const r = await fetch("/api/criar-pagamento", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ itens: itensFormatados })
    });

    const d = await r.json();
    if (!r.ok || !d.url) throw new Error(d.erro || "Erro interno ao processar pagamento");
    
    location.href = d.url;
  } catch (e) {
    msg.textContent = "Erro: " + e.message;
    btn.disabled = false;
    btn.textContent = "Pagar com Mercado Pago";
  }
};

render();
</script>
</body>
</html>
